name: aidocs CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Frontend and backend tests
    runs-on: [k8s-runner, linux-amd64]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Typecheck frontend
        run: cd frontend && npx tsc --noEmit

      - name: Run frontend unit tests with coverage
        run: npm run test:coverage --prefix frontend

      - name: Build frontend test assets
        run: npm run build --prefix frontend

      - name: Run backend tests
        run: go test -tags testfixtures ./...

      - name: Run backend unit coverage gate
        run: |
          set -euo pipefail
          mkdir -p coverage
          go test -tags testfixtures \
            -covermode=count \
            -coverpkg=./api/internal/auth,./api/internal/blob,./api/internal/bots,./api/internal/repo,./api/internal/server \
            -coverprofile=coverage/backend-unit.out \
            ./api/internal/auth ./api/internal/blob ./api/internal/bots ./api/internal/repo ./api/internal/server
          go tool cover -func=coverage/backend-unit.out | tee coverage/backend-unit.txt
          go tool cover -html=coverage/backend-unit.out -o coverage/backend-unit.html
          awk '/^total:/ { gsub("%", "", $3); if ($3 + 0 < 60) { printf("backend unit coverage %.1f%% is below 60%%\n", $3); exit 1 } }' coverage/backend-unit.txt

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/
            frontend/coverage/

  docker:
    name: Build Docker image
    runs-on: [k8s-runner, linux-amd64]
    needs: test
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build metadata
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_SHA}"
          should_build="true"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)"
            if [[ -z "${version}" ]]; then
              should_build="false"
              version="${GITHUB_SHA}"
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "should_build=${should_build}" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image For aidocs
        if: ${{ steps.meta.outputs.should_build == 'true' }}
        uses: razorpay/actions/docker-image-build-push@master
        with:
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
          registry: c.rzp.io
          repository: aidocs
          enable-login: true
          push: true
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            AIDOCS_VERSION=${{ steps.meta.outputs.version }}
            AIDOCS_COMMIT_SHA=${{ github.sha }}
