name: aidocs CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test aidocs
    runs-on: ubuntu-latest
    # Go tests need PostgreSQL. A service container skips the per-package
    # testcontainers startup; locally, plain `go test ./...` starts a
    # disposable container via Docker (see api/internal/testdb).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Typecheck frontend
        run: cd frontend && npx tsc --noEmit

      - name: Build frontend test assets
        run: npm run build --prefix frontend

      - name: Test Go
        run: go test ./...
        env:
          AIDOCS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

  e2e:
    name: E2E compose and browser
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run compose smoke suite
        run: scripts/e2e.sh

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run browser E2E against the running stack
        run: npm run e2e --prefix frontend

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: scripts/e2e.sh down

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only: validates the multi-arch image on every change. Registry
      # publishing moves to a release workflow once the public registry
      # (Docker Hub vs GHCR) is decided.
      - name: Build Docker Image For aidocs
        uses: docker/build-push-action@v6
        with:
          push: false
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            AIDOCS_VERSION=${{ github.sha }}
            AIDOCS_COMMIT_SHA=${{ github.sha }}
