name: aidocs CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test aidocs
    runs-on: [k8s-runner, linux-amd64]
    # Go tests need PostgreSQL. A service container is used here because the
    # runner cannot start testcontainers itself; locally, plain `go test ./...`
    # starts a disposable container via Docker (see api/internal/testdb).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Typecheck frontend
        run: cd frontend && npx tsc --noEmit

      - name: Build frontend test assets
        run: npm run build --prefix frontend

      - name: Test Go
        run: go test ./...
        env:
          AIDOCS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

  docker:
    name: Build Docker image
    runs-on: [k8s-runner, linux-amd64]
    needs: test
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Build Docker Image For aidocs
        uses: razorpay/actions/docker-image-build-push@master
        with:
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
          registry: c.rzp.io
          repository: aidocs
          enable-login: true
          push: true
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            AIDOCS_VERSION=${{ github.sha }}
            AIDOCS_COMMIT_SHA=${{ github.sha }}
