name: aidocs CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test aidocs
    runs-on: [k8s-runner, linux-amd64]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Typecheck frontend
        run: cd frontend && npx tsc --noEmit

      - name: Build frontend test assets
        run: npm run build --prefix frontend

      - name: Test Go
        run: go test -tags testfixtures ./...

  docker:
    name: Build Docker image
    runs-on: [k8s-runner, linux-amd64]
    needs: test
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build metadata
        id: meta
        run: |
          set -euo pipefail
          version="${GITHUB_SHA}"
          should_build="true"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            version="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)"
            if [[ -z "${version}" ]]; then
              should_build="false"
              version="${GITHUB_SHA}"
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "should_build=${should_build}" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image For aidocs
        if: ${{ steps.meta.outputs.should_build == 'true' }}
        uses: razorpay/actions/docker-image-build-push@master
        with:
          username: ${{ secrets.HARBOR_DOCKER_USERNAME }}
          password: ${{ secrets.HARBOR_DOCKER_PASSWORD }}
          registry: c.rzp.io
          repository: aidocs
          enable-login: true
          push: true
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            AIDOCS_VERSION=${{ steps.meta.outputs.version }}
            AIDOCS_COMMIT_SHA=${{ github.sha }}
