name: Dev image

# Builds an image of any branch for internal testing, for example on devstack.
# Start it from the Actions tab, or with:
#
#   gh workflow run dev-image.yml --ref <branch>
#
# It pushes razorpay/slashdocs:dev-<commit> to Docker Hub, as the other public
# Razorpay repositories do for each commit. Internal clusters pull it through
# the Harbor proxy as c.rzp.io/proxy_dockerhub/razorpay/slashdocs:dev-<commit>.
# See docs/releasing.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      # Only the people in this list can publish a dev image. Add a person
      # through a pull request, which a code owner reviews.
      - name: Allow only listed people
        env:
          ALLOWED: anuragrao04 razvi-razorpay
          ACTOR: ${{ github.triggering_actor }}
        run: |
          [[ " $ALLOWED " == *" $ACTOR "* ]] || {
            echo "::error::$ACTOR cannot publish dev images. Ask a maintainer to add you to ALLOWED in .github/workflows/dev-image.yml."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.PUBLIC_DOCKER_USERNAME }}
          password: ${{ secrets.PUBLIC_DOCKER_PASSWORD }}

      # The CLI signing key stays out of this build: a branch must not sign
      # CLIs that every installed CLI would trust.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: razorpay/slashdocs:dev-${{ github.sha }}
          build-args: |
            SLASHDOCS_VERSION=dev-${{ github.sha }}
            SLASHDOCS_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show the image names
        run: |
          {
            echo "Docker Hub: \`razorpay/slashdocs:dev-$GITHUB_SHA\`"
            echo
            echo "Internal clusters: \`c.rzp.io/proxy_dockerhub/razorpay/slashdocs:dev-$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
