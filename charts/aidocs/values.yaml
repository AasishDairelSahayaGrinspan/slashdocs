# aidocs Helm values

replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

image:
  repository: harbor.razorpay.com/razorpay/aidocs
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  imagePullSecrets: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

metrics:
  port: 9090
  service:
    enabled: true

# Deployment mode. `public` allows any Google login (optionally gated by
# allowedOAuthDomains); `org` gates login to deployment.orgDomains and labels
# "everyone" sharing as the org.
deployment:
  mode: org
  # Comma-separated org domains. Required when mode=org; also the login gate.
  orgDomains: "razorpay.com"
  # Org display name used in share UI copy (e.g. "Anyone in Acme").
  orgName: "Razorpay"

# Public origins. In production, prefer a separate render origin to isolate
# untrusted uploaded HTML from the authenticated application.
origins:
  app: https://aidocs.dev.razorpay.in
  render: https://render.aidocs.razorpay.in

# Google OAuth web client. Configure the callback URL in Google Cloud as:
#   https://aidocs.example.com/v1/auth/google/callback
googleOAuth:
  clientID: ""
  clientSecret: ""
  existingSecret: ""
  clientIDKey: GOOGLE_OAUTH_CLIENT_ID
  clientSecretKey: GOOGLE_OAUTH_CLIENT_SECRET

# Session secret must be at least 32 bytes.
session:
  secret: ""
  existingSecret: ""
  secretKey: SESSION_SECRET

# Postgres connection. The component values are read from the secret into
# env vars, then `url` is composed from them at runtime via Kubernetes
# $(VAR) env expansion
database:
  existingSecret: ""
  host: ""
  user: ""
  password: ""
  name: ""
  hostKey: DATABASE_HOST
  userKey: DATABASE_USER
  passwordKey: DATABASE_PASSWORD
  nameKey: DATABASE_NAME
  port: 5432
  sslMode: require
  migrate: true

# S3-compatible blob storage for immutable HTML versions.
blob:
  bucket: ""
  region: us-east-1
  endpoint: ""
  forcePathStyle: false
  accessKeyID: ""
  secretAccessKey: ""
  existingSecret: ""
  accessKeyIDKey: blob-access-key-id
  secretAccessKeyKey: blob-secret-access-key

# Optional comma-separated domain allowlist for Google OAuth login.
allowedOAuthDomains: "razorpay.com"

# Optional runtime revision surfaced at /commit.txt.
commitSha: ""

extraEnv: []
# - name: FOO
#   value: bar

extraEnvFrom: []
# - secretRef:
#     name: aidocs-extra

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aidocs.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: aidocs-tls
  #   hosts:
  #     - aidocs.example.com

# Traefik IngressRoute (used by clusters that run Traefik CRDs instead of
# native Ingress). Routes the app host (and optionally a separate render host)
# to the app port; the metrics port is never routed here.
#
# When edge.enabled is true, traffic is routed to the Edge (Kong) TraefikService
# instead of the aidocs service directly. This is the production pattern —
# Edge handles upstream routing to aidocs via terraform-kong config.
ingressRoute:
  enabled: false
  host: ""
  # Optional separate origin for sandbox-rendered HTML. Leave empty to serve
  # render on the same host (acceptable for non-production only).
  renderHost: ""
  entryPoints:
    - web
  annotations: {}
  middlewares:
    - name: headers-common
      namespace: traefik-v2
  # Edge (Kong) routing — set edge.enabled=true in production to route
  # through Edge instead of directly to the aidocs service.
  edge:
    enabled: false
    traefikServiceName: edge-dp-common
    traefikServiceNamespace: edge-dp

nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1
