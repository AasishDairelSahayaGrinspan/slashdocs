# aidocs Helm values

replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

image:
  repository: razorpay/aidocs
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  imagePullSecrets: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

metrics:
  port: 9090
  service:
    enabled: true

# Deployment mode. `public` allows any account accepted by the configured OIDC
# provider (optionally gated by allowedOAuthDomains); `org` gates login to
# deployment.orgDomains and labels "everyone" sharing as the org.
deployment:
  mode: org
  # Comma-separated org domains. Required when mode=org; also the login gate.
  orgDomains: "example.com"
  # Org display name used in share UI copy (e.g. "Anyone in Acme").
  orgName: "Example"

# Public origins. `app` and `render` MUST be different hosts in production:
# the render origin serves untrusted uploaded HTML in a sandboxed frame, and
# a separate host keeps that content outside the authenticated app origin's
# cookie and same-origin boundary.
origins:
  app: https://aidocs.example.com
  render: https://render.aidocs.example.com

# Sign-in. Configure exactly one of `googleOAuth` and `oidc` (setting
# oidc.issuerURL switches the chart to the generic OIDC variables).

# Google OAuth web client. Configure the callback URL in Google Cloud as:
#   https://aidocs.example.com/v1/auth/google/callback
googleOAuth:
  clientID: ""
  clientSecret: ""
  existingSecret: ""
  clientIDKey: GOOGLE_OAUTH_CLIENT_ID
  clientSecretKey: GOOGLE_OAUTH_CLIENT_SECRET

# Generic OpenID Connect provider (Okta, Entra ID, Keycloak, Dex, ...).
# Register the redirect URI with the provider as:
#   https://aidocs.example.com/v1/auth/oidc/callback
oidc:
  issuerURL: ""
  # Display label for the login button ("Continue with <name>"); the server
  # defaults it to "SSO".
  providerName: ""
  # Base URL where the server reaches the IdP when that differs from the
  # browser-facing issuer (split horizon). Usually empty.
  internalIssuerURL: ""
  clientID: ""
  clientSecret: ""
  existingSecret: ""
  clientIDKey: AIDOCS_OIDC_CLIENT_ID
  clientSecretKey: AIDOCS_OIDC_CLIENT_SECRET

# Session secret must be at least 32 bytes.
session:
  secret: ""
  existingSecret: ""
  secretKey: SESSION_SECRET

# Postgres connection. The component values are read from the secret into
# env vars, then `url` is composed from them at runtime via Kubernetes
# $(VAR) env expansion
database:
  existingSecret: ""
  host: ""
  user: ""
  password: ""
  name: ""
  hostKey: DATABASE_HOST
  userKey: DATABASE_USER
  passwordKey: DATABASE_PASSWORD
  nameKey: DATABASE_NAME
  port: 5432
  sslMode: require
  migrate: true

# S3-compatible blob storage for immutable HTML versions.
blob:
  bucket: ""
  region: us-east-1
  endpoint: ""
  forcePathStyle: false
  accessKeyID: ""
  secretAccessKey: ""
  existingSecret: ""
  accessKeyIDKey: blob-access-key-id
  secretAccessKeyKey: blob-secret-access-key

# Optional comma-separated email-domain allowlist applied after OIDC login.
allowedOAuthDomains: "example.com"

# Optional runtime revision surfaced at /commit.txt.
commitSha: ""

extraEnv: []
# - name: FOO
#   value: bar

extraEnvFrom: []
# - secretRef:
#     name: aidocs-extra

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aidocs.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: aidocs-tls
  #   hosts:
  #     - aidocs.example.com

# Traefik IngressRoute (used by clusters that run Traefik CRDs instead of
# native Ingress). Routes the app host (and optionally a separate render host)
# to the app port; the metrics port is never routed here.
ingressRoute:
  enabled: false
  host: ""
  # Separate host for sandbox-rendered HTML. Required when the IngressRoute is
  # enabled, and it must differ from `host`: rendering untrusted document HTML
  # on the app origin would let uploaded scripts run same-origin with the
  # authenticated application. Template rendering fails if this is empty or
  # equal to `host`.
  renderHost: ""
  entryPoints:
    - http
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1
