{{- $oidcEnabled := ne .Values.oidc.issuerURL "" }}
{{- $needsOAuthKeys := ternary (not .Values.oidc.existingSecret) (not .Values.googleOAuth.existingSecret) $oidcEnabled }}
{{- $personalProviderConfigured := or .Values.personalConnections.github.existingSecret .Values.personalConnections.github.clientID .Values.personalConnections.github.clientSecret .Values.personalConnections.slack.existingSecret .Values.personalConnections.slack.clientID .Values.personalConnections.slack.clientSecret .Values.personalConnections.googleDrive.existingSecret .Values.personalConnections.googleDrive.clientID .Values.personalConnections.googleDrive.clientSecret .Values.personalConnections.googlePicker.existingSecret .Values.personalConnections.googlePicker.apiKey .Values.personalConnections.googlePicker.appID }}
{{- $personalEncryptionConfigured := or .Values.personalConnections.encryption.existingSecret .Values.personalConnections.encryption.key }}
{{- if and $personalProviderConfigured (not $personalEncryptionConfigured) }}
{{- fail "personalConnections.encryption.key or personalConnections.encryption.existingSecret is required when personal connection OAuth or Picker credentials are configured" }}
{{- end }}
{{- $needsPersonalSecret := or (and (not .Values.personalConnections.encryption.existingSecret) .Values.personalConnections.encryption.key) (and (not .Values.personalConnections.github.existingSecret) (or .Values.personalConnections.github.clientID .Values.personalConnections.github.clientSecret)) (and (not .Values.personalConnections.slack.existingSecret) (or .Values.personalConnections.slack.clientID .Values.personalConnections.slack.clientSecret)) (and (not .Values.personalConnections.googleDrive.existingSecret) (or .Values.personalConnections.googleDrive.clientID .Values.personalConnections.googleDrive.clientSecret)) (and (not .Values.personalConnections.googlePicker.existingSecret) (or .Values.personalConnections.googlePicker.apiKey .Values.personalConnections.googlePicker.appID)) }}
{{- if or $needsOAuthKeys (not .Values.session.existingSecret) (not .Values.database.existingSecret) (and (not .Values.blob.existingSecret) (or .Values.blob.accessKeyID .Values.blob.secretAccessKey)) (and (not .Values.kvEvents.existingSecret) .Values.kvEvents.listenerDatabaseURL) $needsPersonalSecret (and (not .Values.connectedKnowledge.existingSecret) (or .Values.connectedKnowledge.githubToken .Values.connectedKnowledge.githubWebhookSecret)) (and (not .Values.connectedKnowledge.slackExistingSecret) .Values.connectedKnowledge.slackSigningSecret) (and (not .Values.connectedKnowledge.devRevExistingSecret) .Values.connectedKnowledge.devRevWebhookSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aidocs.secretName" . }}
  labels:
    {{- include "aidocs.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and $oidcEnabled (not .Values.oidc.existingSecret) }}
  {{ .Values.oidc.clientIDKey }}: {{ required "oidc.clientID is required unless oidc.existingSecret is set" .Values.oidc.clientID | quote }}
  {{ .Values.oidc.clientSecretKey }}: {{ required "oidc.clientSecret is required unless oidc.existingSecret is set" .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- if and (not $oidcEnabled) (not .Values.googleOAuth.existingSecret) }}
  {{ .Values.googleOAuth.clientIDKey }}: {{ required "googleOAuth.clientID is required unless googleOAuth.existingSecret is set (or oidc.issuerURL is used)" .Values.googleOAuth.clientID | quote }}
  {{ .Values.googleOAuth.clientSecretKey }}: {{ required "googleOAuth.clientSecret is required unless googleOAuth.existingSecret is set (or oidc.issuerURL is used)" .Values.googleOAuth.clientSecret | quote }}
  {{- end }}
  {{- if not .Values.session.existingSecret }}
  {{ .Values.session.secretKey }}: {{ required "session.secret is required unless session.existingSecret is set" .Values.session.secret | quote }}
  {{- end }}
  {{- if not .Values.database.existingSecret }}
  {{ .Values.database.hostKey }}: {{ required "database.host is required unless database.existingSecret is set" .Values.database.host | quote }}
  {{ .Values.database.userKey }}: {{ required "database.user is required unless database.existingSecret is set" .Values.database.user | quote }}
  {{ .Values.database.passwordKey }}: {{ required "database.password is required unless database.existingSecret is set" .Values.database.password | quote }}
  {{ .Values.database.nameKey }}: {{ required "database.name is required unless database.existingSecret is set" .Values.database.name | quote }}
  {{- end }}
  {{- if and (not .Values.blob.existingSecret) (or .Values.blob.accessKeyID .Values.blob.secretAccessKey) }}
  {{ .Values.blob.accessKeyIDKey }}: {{ .Values.blob.accessKeyID | quote }}
  {{ .Values.blob.secretAccessKeyKey }}: {{ .Values.blob.secretAccessKey | quote }}
  {{- end }}
  {{- if and (not .Values.kvEvents.existingSecret) .Values.kvEvents.listenerDatabaseURL }}
  {{ .Values.kvEvents.listenerDatabaseURLKey }}: {{ .Values.kvEvents.listenerDatabaseURL | quote }}
  {{- end }}
  {{- if and (not .Values.personalConnections.encryption.existingSecret) .Values.personalConnections.encryption.key }}
  {{ .Values.personalConnections.encryption.secretKey }}: {{ .Values.personalConnections.encryption.key | quote }}
  {{- end }}
  {{- if and (not .Values.personalConnections.github.existingSecret) (or .Values.personalConnections.github.clientID .Values.personalConnections.github.clientSecret) }}
  {{ .Values.personalConnections.github.clientIDKey }}: {{ required "personalConnections.github.clientID is required when GitHub personal connections are configured" .Values.personalConnections.github.clientID | quote }}
  {{ .Values.personalConnections.github.clientSecretKey }}: {{ required "personalConnections.github.clientSecret is required when GitHub personal connections are configured" .Values.personalConnections.github.clientSecret | quote }}
  {{- end }}
  {{- if and (not .Values.personalConnections.slack.existingSecret) (or .Values.personalConnections.slack.clientID .Values.personalConnections.slack.clientSecret) }}
  {{ .Values.personalConnections.slack.clientIDKey }}: {{ required "personalConnections.slack.clientID is required when Slack personal connections are configured" .Values.personalConnections.slack.clientID | quote }}
  {{ .Values.personalConnections.slack.clientSecretKey }}: {{ required "personalConnections.slack.clientSecret is required when Slack personal connections are configured" .Values.personalConnections.slack.clientSecret | quote }}
  {{- end }}
  {{- if and (not .Values.personalConnections.googleDrive.existingSecret) (or .Values.personalConnections.googleDrive.clientID .Values.personalConnections.googleDrive.clientSecret) }}
  {{ .Values.personalConnections.googleDrive.clientIDKey }}: {{ required "personalConnections.googleDrive.clientID is required when Google Drive personal connections are configured" .Values.personalConnections.googleDrive.clientID | quote }}
  {{ .Values.personalConnections.googleDrive.clientSecretKey }}: {{ required "personalConnections.googleDrive.clientSecret is required when Google Drive personal connections are configured" .Values.personalConnections.googleDrive.clientSecret | quote }}
  {{- end }}
  {{- if and (not .Values.personalConnections.googlePicker.existingSecret) (or .Values.personalConnections.googlePicker.apiKey .Values.personalConnections.googlePicker.appID) }}
  {{ .Values.personalConnections.googlePicker.apiKeyKey }}: {{ required "personalConnections.googlePicker.apiKey is required when Google Picker is configured" .Values.personalConnections.googlePicker.apiKey | quote }}
  {{ .Values.personalConnections.googlePicker.appIDKey }}: {{ required "personalConnections.googlePicker.appID is required when Google Picker is configured" .Values.personalConnections.googlePicker.appID | quote }}
  {{- end }}
  {{- if and (not .Values.connectedKnowledge.existingSecret) .Values.connectedKnowledge.githubToken }}
  {{ .Values.connectedKnowledge.githubTokenKey }}: {{ .Values.connectedKnowledge.githubToken | quote }}
  {{- end }}
  {{- if and (not .Values.connectedKnowledge.existingSecret) .Values.connectedKnowledge.githubWebhookSecret }}
  {{ .Values.connectedKnowledge.githubWebhookSecretKey }}: {{ .Values.connectedKnowledge.githubWebhookSecret | quote }}
  {{- end }}
  {{- if and (not .Values.connectedKnowledge.slackExistingSecret) .Values.connectedKnowledge.slackSigningSecret }}
  {{ .Values.connectedKnowledge.slackSigningSecretKey }}: {{ .Values.connectedKnowledge.slackSigningSecret | quote }}
  {{- end }}
  {{- if and (not .Values.connectedKnowledge.devRevExistingSecret) .Values.connectedKnowledge.devRevWebhookSecret }}
  {{ .Values.connectedKnowledge.devRevWebhookSecretKey }}: {{ .Values.connectedKnowledge.devRevWebhookSecret | quote }}
  {{- end }}
{{- end }}
