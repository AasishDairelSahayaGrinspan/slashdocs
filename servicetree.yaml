service: slashdocs  # required, canonical slug — immutable once registered
displayName: "Slashdocs"  # required, human-readable name — README title "# slashdocs"
description: "A self-hostable Google-Docs-like review layer for AI-generated HTML artifacts: agents publish self-contained HTML reports, specs and dashboards (via API, CLI or MCP endpoint) and humans review them in the browser with anchored comments, versions and sharing."  # required, one-sentence description of what the service does — README ("slashdocs is a Google-Docs-like review layer for AI-generated HTML artifacts... humans review them in the browser with comments, versions, and sharing"; features: OIDC login, service accounts, remote MCP endpoint, OpenAPI docs, Go server with embedded React frontend)
type: service  # required, one of: service | worker | cron | library | pipeline — self-hostable Go HTTP server with an embedded React frontend, generated Swagger docs, a Dockerfile and a helm chart in the repo; not yet visible in Netra/Spinnaker, but the deployment artifacts mark it as a server, not a library
tier: T3  # required, one of: T0 | T1 | T2 | T3 — new internal developer-experience tooling (a review UI for agent artifacts); no alert rules, no runbook, no Netra deployment; an outage inconveniences doc review, it does not degrade a product
lifecycle: incubating  # optional, one of: incubating | live | deprecated | retired (default: live) — no evidence of a prod deployment (no Netra, Spinnaker, alerts, runbook or Grafana), but actively developed (last push 2026-09-07)

domain: tech-infra/developer-experience  # required, two-level domain/subgroup slug — family tech-infra from the registry seed BU "DevOps"; area developer-experience for a tool whose users are engineers and their agents. TO VERIFY: no existing area slug under tech-infra was confirmed for this; the seed pod is "DevOps"

