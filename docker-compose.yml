# Local dev/eval stack: slashdocs + Postgres + MinIO + Dex.
#
#   docker compose up --build
#   open http://localhost:8080 and sign in as admin@example.com / password
#
# Dex is the DEV identity provider only; real deployments configure Google or
# any OIDC provider per docs/self-hosting.md. `make e2e` runs the full smoke
# test against this stack.
#
# The app is served on http://localhost:8080 and documents render on
# http://127.0.0.1:8080 — same listener, but a different browser origin, which
# is how slashdocs keeps untrusted document HTML away from your session.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: slashdocs
      POSTGRES_PASSWORD: slashdocs
      POSTGRES_DB: slashdocs
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slashdocs -d slashdocs"]
      interval: 2s
      timeout: 3s
      retries: 30

  # MinIO stopped publishing community images: docker.io/minio/minio and
  # docker.io/minio/mc are both gone (Hub returns 404, and the registry reports
  # deleted repos as "authentication required", which misleads you into thinking
  # it is a docker login problem). quay.io and mirror.gcr.io have no public copy
  # either. These Bitnami Legacy images are the same upstream MinIO builds,
  # still public, pinned to an exact tag so this cannot drift again.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    # No `command:` — the Bitnami image wraps MinIO in its own entrypoint and
    # starts the server itself. The data dir is its default, /bitnami/minio/data;
    # mounting the volume there also inherits the image's uid-1001 ownership,
    # which an empty volume at /data would not.
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot sidecar that creates the document bucket, then exits.
  minio-init:
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # The image runs as uid 1001 with no home directory; mc needs a writable
      # one for the alias config it writes before `mc mb`.
      HOME: /tmp
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/slashdocs-documents

  dex:
    image: dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dev/dex-config.yaml:/etc/dex/config.yaml:ro
    ports:
      # Browsers are redirected to Dex during login, so it must be reachable
      # from the host too (SLASHDOCS_OIDC_ISSUER_URL below).
      - "5556:5556"
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5556/dex/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  slashdocs:
    build: .
    # CI prebuilds this image once with a shared layer cache and injects the
    # tag; local runs fall back to an ordinary compose build. The image is built
    # here, not pulled from a registry.
    # nosemgrep: razorpay.custom-docker-base-image-check-docker-compose
    image: ${SLASHDOCS_IMAGE:-slashdocs-e2e:local}
    ports:
      - "8080:8080"
    environment:
      # nosemgrep: generic_postgres_string
      DATABASE_URL: postgres://slashdocs:slashdocs@postgres:5432/slashdocs?sslmode=disable
      SLASHDOCS_MIGRATE: "true"
      # The compose stack uses direct Postgres, so exercise LISTEN/NOTIFY rather
      # than allowing the E2E harness to pass through the polling fallback.
      SLASHDOCS_KV_EVENTS_MODE: notify

      BLOB_BUCKET: slashdocs-documents
      BLOB_ENDPOINT: http://minio:9000
      BLOB_FORCE_PATH_STYLE: "true"
      BLOB_ACCESS_KEY_ID: minioadmin
      BLOB_SECRET_ACCESS_KEY: minioadmin
      BLOB_REGION: us-east-1

      # Optional: supplied by the local process environment for Slack testing.
      SLASHDOCS_SLACK_BOT_TOKEN: ${SLASHDOCS_SLACK_BOT_TOKEN:-}

      SLASHDOCS_APP_ORIGIN: http://localhost:8080
      # Distinct browser origin, same listener: the server only serves /v/…
      # renders when the request's Host matches this origin.
      SLASHDOCS_RENDER_ORIGIN: http://127.0.0.1:8080

      # Split horizon: browsers reach Dex on localhost:5556, the server
      # reaches it on the compose network at dex:5556.
      SLASHDOCS_OIDC_ISSUER_URL: http://localhost:5556/dex
      SLASHDOCS_OIDC_INTERNAL_ISSUER_URL: http://dex:5556/dex
      SLASHDOCS_OIDC_CLIENT_ID: slashdocs
      SLASHDOCS_OIDC_CLIENT_SECRET: slashdocs-dev-secret
      SLASHDOCS_OIDC_PROVIDER_NAME: Dex

      # Optional per-user GitHub OAuth App credentials. Export these before
      # running Compose to exercise GitHub-backed documents locally.
      SLASHDOCS_GITHUB_CLIENT_ID: ${SLASHDOCS_GITHUB_CLIENT_ID:-}
      SLASHDOCS_GITHUB_CLIENT_SECRET: ${SLASHDOCS_GITHUB_CLIENT_SECRET:-}

      # Dev-only value; generate your own for anything beyond localhost.
      SESSION_SECRET: dev-only-session-secret-0123456789abcdef
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      dex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  postgres-data:
  minio-data:
