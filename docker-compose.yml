services:
  postgres:
    image: postgres:16-alpine # nosemgrep: razorpay.custom-docker-base-image-check-docker-compose
    restart: unless-stopped
    environment:
      POSTGRES_USER: aidocs
      POSTGRES_PASSWORD: aidocs
      POSTGRES_DB: aidocs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidocs"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest # nosemgrep: razorpay.custom-docker-base-image-check-docker-compose
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot container to create the S3 bucket in MinIO
  minio-init:
    image: minio/mc:latest # nosemgrep: razorpay.custom-docker-base-image-check-docker-compose
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/aidocs-documents &&
        echo 'Bucket ready.'
      "

  aidocs:
    build:
      context: .
      dockerfile: Dockerfile.local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://aidocs:aidocs@postgres:5432/aidocs?sslmode=disable # nosemgrep: generic_postgres_string
      BLOB_BUCKET: aidocs-documents
      BLOB_ENDPOINT: http://minio:9000
      BLOB_FORCE_PATH_STYLE: "true"
      BLOB_ACCESS_KEY_ID: minioadmin
      BLOB_SECRET_ACCESS_KEY: minioadmin
      BLOB_REGION: us-east-1
      AIDOCS_APP_ORIGIN: http://localhost:8080
      AIDOCS_RENDER_ORIGIN: http://localhost:8080
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?Set in .env — see README}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?Set in .env — see README}
      SESSION_SECRET: ${SESSION_SECRET:?Generate with: openssl rand -hex 32}
      AIDOCS_MIGRATE: "true"

volumes:
  postgres_data:
  minio_data:
