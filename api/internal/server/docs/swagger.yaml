info:
  contact: {}
  description: This API powers a review tool where people can upload one self-contained
    HTML file, view it, and leave comments anchored to specific text ranges inside
    that HTML.
  title: aidocs API
  version: v1
paths:
  /.well-known/aidocs.json:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.discoveryResponse'
      summary: Deployment discovery
      tags:
      - discovery
  /commit.txt:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Build commit SHA
      tags:
      - discovery
  /v/{id}/{version_id}:
    get:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Version ID
        in: path
        name: version_id
        required: true
        type: string
      - description: Render token
        in: query
        name: token
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Render version wrapper
      tags:
      - render
  /v1/auth/cli/credentials:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.listResponse-repo_CLICredential'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: List CLI credentials
      tags:
      - auth
  /v1/auth/cli/credentials/{id}:
    delete:
      parameters:
      - description: Credential ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Revoke CLI credential
      tags:
      - auth
  /v1/auth/cli/exchange:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
