        documentation impact analysis.
      parameters:
      - description: sha256 HMAC signature
        in: header
        name: X-Hub-Signature-256
        required: true
        type: string
      - description: Unique GitHub delivery ID
        in: header
        name: X-GitHub-Delivery
        required: true
        type: string
      - description: GitHub event name
        in: header
        name: X-GitHub-Event
        required: true
        type: string
      - description: GitHub webhook payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Duplicate delivery
          schema:
            additionalProperties: true
            type: object
        "202":
          description: Accepted, queued, or intentionally ignored delivery
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Receive GitHub source events
      tags:
      - connected-source-webhooks
  /v1/webhooks/slack:
    post:
      consumes:
      - application/json
      description: Verify Slack's v0 HMAC and replay timestamp, answer URL verification,
        deduplicate event IDs, and queue matching message or thread updates.
      parameters:
      - description: Slack v0 HMAC signature
        in: header
        name: X-Slack-Signature
        required: true
        type: string
      - description: Unix request timestamp
        in: header
        name: X-Slack-Request-Timestamp
        required: true
        type: string
      - description: Slack Events API envelope
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: URL verification challenge or duplicate delivery
          schema:
            type: string
        "202":
          description: Accepted event
          schema:
            $ref: '#/definitions/server.sourceDeliveryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Receive Slack thread events
      tags:
      - connected-source-webhooks
