basePath: /
definitions:
  auth.Principal:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      picture_url:
        type: string
      type:
        $ref: '#/definitions/auth.PrincipalType'
    type: object
  auth.PrincipalType:
    enum:
    - user
    - service_account
    - anyone
    - anonymous
    type: string
    x-enum-varnames:
    - PrincipalUser
    - PrincipalServiceAccount
    - PrincipalAnyone
    - PrincipalAnonymous
  repo.Anchor:
    properties:
      dom_path:
        type: string
      end_offset:
        type: integer
      prefix:
        type: string
      quote:
        type: string
      start_offset:
        type: integer
      suffix:
        type: string
    type: object
  repo.CLICredential:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  repo.Document:
    properties:
      current_version_id:
        type: string
      id:
        type: string
      owner:
        $ref: '#/definitions/auth.Principal'
      parent_folder:
        $ref: '#/definitions/repo.FolderBreadcrumb'
      parent_folder_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  repo.FolderBreadcrumb:
    properties:
      id:
        type: string
      title:
        type: string
    type: object
  repo.Grant:
    properties:
      document_id:
        type: string
      granted_by:
        $ref: '#/definitions/auth.Principal'
      id:
        type: string
      principal:
        $ref: '#/definitions/auth.Principal'
      resource_id:
        type: string
      resource_type:
        type: string
      role:
        $ref: '#/definitions/repo.Role'
    type: object
  repo.OwnershipTransfer:
    properties:
      from_user_id:
        type: string
      id:
        type: string
      service_account_id:
        type: string
      status:
        type: string
      to_user_id:
        type: string
    type: object
  repo.Role:
    enum:
    - ""
    - viewer
    - commenter
    - editor
    - owner
    type: string
    x-enum-varnames:
    - RoleNone
    - RoleViewer
    - RoleCommenter
    - RoleEditor
    - RoleOwner
  repo.ServiceAccount:
    properties:
      disabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/auth.Principal'
    type: object
  repo.ServiceAccountKey:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  repo.Version:
    properties:
      change_summary:
        type: string
      created_by:
        $ref: '#/definitions/auth.Principal'
      document_id:
        type: string
      id:
        type: string
      number:
        type: integer
      sha256:
        type: string
    type: object
  server.cliExchangePrincipal:
    properties:
      email:
        type: string
      id:
        type: string
      type:
        type: string
    type: object
  server.cliExchangeResponse:
    properties:
      id:
        type: string
      principal:
        $ref: '#/definitions/server.cliExchangePrincipal'
      token:
        type: string
    type: object
  server.commentMentionPrincipalRef:
    properties:
      id:
        type: string
      type:
        $ref: '#/definitions/server.commentMentionPrincipalType'
    type: object
  server.commentMentionPrincipalResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      picture_url:
        type: string
      type:
        $ref: '#/definitions/server.commentMentionPrincipalType'
    type: object
  server.commentMentionPrincipalType:
    enum:
    - user
    - service_account
    type: string
    x-enum-varnames:
    - commentMentionPrincipalUser
    - commentMentionPrincipalServiceAccount
  server.commentMentionRequest:
    properties:
      length:
        description: Length is the range length in UTF-16 code units.
        type: integer
      offset:
        description: Offset is the zero-based start in UTF-16 code units.
        type: integer
      principal:
        $ref: '#/definitions/server.commentMentionPrincipalRef'
    type: object
  server.commentMentionResponse:
    properties:
      length:
        description: Length is the range length in UTF-16 code units.
        type: integer
      offset:
        description: Offset is the zero-based start in UTF-16 code units.
        type: integer
      principal:
        $ref: '#/definitions/server.commentMentionPrincipalResponse'
    type: object
  server.commentPlacementResponse:
    properties:
      anchor:
        $ref: '#/definitions/repo.Anchor'
      confidence:
        type: number
      matched_text:
        type: string
      status:
        type: string
      version_id:
        type: string
    type: object
  server.commentResponse:
    properties:
      anchor:
        $ref: '#/definitions/repo.Anchor'
      author:
        $ref: '#/definitions/server.principalResponse'
      body:
        type: string
      created_on_version_id:
        type: string
      current_placement:
        $ref: '#/definitions/server.commentPlacementResponse'
      id:
        type: string
      mentions:
        items:
          $ref: '#/definitions/server.commentMentionResponse'
        type: array
      parent_comment_id:
        type: string
      replies:
        items:
          $ref: '#/definitions/server.commentResponse'
        type: array
      selected_text:
        type: string
      status:
        type: string
    type: object
  server.configResponse:
    properties:
      default_doc_permission:
        type: string
      deployment:
        type: string
      everyone_label:
        type: string
      org_name:
        type: string
      provider_name:
        type: string
    type: object
  server.createCommentReplyRequest:
    properties:
      body:
        type: string
      mentions:
        items:
          $ref: '#/definitions/server.commentMentionRequest'
        type: array
    type: object
  server.createCommentRequest:
    properties:
      anchor:
        $ref: '#/definitions/repo.Anchor'
      body:
        type: string
      mentions:
        items:
          $ref: '#/definitions/server.commentMentionRequest'
        type: array
      version_id:
        type: string
    type: object
  server.createDocumentResponse:
    properties:
      current_version_id:
        type: string
      default_grant:
        $ref: '#/definitions/server.defaultGrant'
      id:
        type: string
    type: object
  server.createGrantResponse:
    properties:
      granted_by:
        $ref: '#/definitions/server.grantGrantedBy'
      id:
        type: string
      principal:
        $ref: '#/definitions/server.grantPrincipal'
      resource:
        $ref: '#/definitions/server.grantResource'
      role:
        $ref: '#/definitions/repo.Role'
    type: object
  server.createServiceAccountResponse:
    properties:
      disabled:
        type: boolean
      grants:
        items: {}
        type: array
      id:
        type: string
      key:
        $ref: '#/definitions/server.serviceAccountKey'
      label:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/server.serviceAccountOwner'
    type: object
  server.createVersionResponse:
    properties:
      change_summary:
        type: string
      id:
        type: string
      number:
        type: integer
      sha256:
        type: string
    type: object
  server.defaultGrant:
    properties:
      grant_id:
        type: string
      principal:
        $ref: '#/definitions/server.defaultGrantPrincipal'
      role:
        $ref: '#/definitions/repo.Role'
    type: object
  server.defaultGrantPrincipal:
    properties:
      type:
        $ref: '#/definitions/auth.PrincipalType'
    type: object
  server.discoveryAuth:
    properties:
      modes:
        items:
          type: string
        type: array
    type: object
  server.discoveryResponse:
    properties:
      api_version:
        type: string
      auth:
        $ref: '#/definitions/server.discoveryAuth'
      name:
        type: string
    type: object
  server.errorBody:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  server.errorEnvelope:
    properties:
      error:
        $ref: '#/definitions/server.errorBody'
    type: object
  server.grantGrantedBy:
    properties:
      email:
        type: string
      id:
        type: string
    type: object
  server.grantPrincipal:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        $ref: '#/definitions/auth.PrincipalType'
    type: object
  server.grantResource:
    properties:
      id:
        type: string
      type:
        type: string
    type: object
  server.listResponse-repo_CLICredential:
    properties:
      items:
        items:
          $ref: '#/definitions/repo.CLICredential'
        type: array
    type: object
  server.listResponse-repo_Document:
    properties:
      items:
        items:
          $ref: '#/definitions/repo.Document'
        type: array
    type: object
  server.listResponse-repo_OwnershipTransfer:
    properties:
      items:
        items:
          $ref: '#/definitions/repo.OwnershipTransfer'
        type: array
    type: object
  server.listResponse-repo_ServiceAccount:
    properties:
      items:
        items:
          $ref: '#/definitions/repo.ServiceAccount'
        type: array
    type: object
  server.listResponse-repo_ServiceAccountKey:
    properties:
      items:
        items:
          $ref: '#/definitions/repo.ServiceAccountKey'
        type: array
    type: object
  server.listResponse-repo_Version:
    properties:
      items:
        items:
          $ref: '#/definitions/repo.Version'
        type: array
    type: object
  server.listResponse-server_commentResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/server.commentResponse'
        type: array
    type: object
  server.meResponse:
    properties:
      principal:
        $ref: '#/definitions/server.principalRef'
      service_account:
        $ref: '#/definitions/server.meServiceAccount'
      user:
        $ref: '#/definitions/server.userResponse'
    type: object
  server.meServiceAccount:
    properties:
      disabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/server.meServiceOwner'
    type: object
  server.meServiceOwner:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  server.patchCommentRequest:
    properties:
      body:
        type: string
      mentions:
        items:
          $ref: '#/definitions/server.commentMentionRequest'
        type: array
      status:
        type: string
    type: object
  server.principalRef:
    properties:
      id:
        type: string
      type:
        $ref: '#/definitions/auth.PrincipalType'
    type: object
  server.principalResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      picture_url:
        type: string
      type:
        $ref: '#/definitions/auth.PrincipalType'
    type: object
  server.renderTokenResponse:
    properties:
      token:
        type: string
      url:
        type: string
    type: object
  server.serviceAccountKey:
    properties:
      id:
        type: string
      token:
        type: string
    type: object
  server.serviceAccountOwner:
    properties:
      email:
        type: string
      id:
        type: string
    type: object
  server.userResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      picture_url:
        type: string
    type: object
info:
  contact: {}
  description: This API powers a review tool where people can upload one self-contained
    HTML file, view it, and leave comments anchored to specific text ranges inside
    that HTML.
  title: aidocs API
  version: v1
paths:
  /.well-known/aidocs.json:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.discoveryResponse'
      summary: Deployment discovery
      tags:
      - discovery
  /commit.txt:
    get:
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Build commit SHA
      tags:
      - discovery
  /v/{id}/{version_id}:
    get:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Version ID
        in: path
        name: version_id
        required: true
        type: string
      - description: Render token
        in: query
        name: token
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Render version wrapper
      tags:
      - render
  /v1/auth/cli/credentials:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.listResponse-repo_CLICredential'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: List CLI credentials
      tags:
      - auth
  /v1/auth/cli/credentials/{id}:
    delete:
      parameters:
      - description: Credential ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Revoke CLI credential
      tags:
      - auth
  /v1/auth/cli/exchange:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.cliExchangeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.errorEnvelope'
      summary: Exchange CLI login code
      tags:
      - auth
  /v1/auth/google/callback:
    get:
      parameters:
      - description: OAuth code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state
        in: query
        name: state
        required: true
        type: string
      responses:
        "302":
          description: Found
      summary: OIDC login callback
      tags:
      - auth
  /v1/auth/google/start:
    get:
      parameters:
      - description: web or cli
        in: query
        name: mode
        type: string
      - description: web redirect
        in: query
        name: redirect
        type: string
      - description: CLI loopback redirect
        in: query
        name: cli_redirect
        type: string
      - description: PKCE challenge
        in: query
        name: code_challenge
        type: string
      - description: CLI correlation state; web state is generated by the server
        in: query
        name: state
        type: string
      responses:
        "302":
          description: Found
      summary: Start OIDC login
      tags:
      - auth
  /v1/auth/oidc/callback:
    get:
      parameters:
      - description: OAuth code
        in: query
        name: code
        required: true
        type: string
      - description: OAuth state
        in: query
        name: state
        required: true
        type: string
      responses:
        "302":
          description: Found
      summary: OIDC login callback
      tags:
      - auth
  /v1/auth/oidc/start:
    get:
      parameters:
      - description: web or cli
        in: query
        name: mode
        type: string
      - description: web redirect
        in: query
        name: redirect
        type: string
      - description: CLI loopback redirect
        in: query
        name: cli_redirect
        type: string
      - description: PKCE challenge
        in: query
        name: code_challenge
        type: string
      - description: CLI correlation state; web state is generated by the server
        in: query
        name: state
        type: string
      responses:
        "302":
          description: Found
      summary: Start OIDC login
      tags:
      - auth
  /v1/config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.configResponse'
      summary: Deployment configuration
      tags:
      - discovery
  /v1/documents:
    get:
      parameters:
      - description: Title search query
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.listResponse-repo_Document'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: List documents
      tags:
      - documents
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Document title
        in: formData
        name: title
        required: true
        type: string
      - description: Single-file HTML
        in: formData
        name: file
        required: true
        type: file
      - description: 'Default sharing applied at create: viewer, commenter, editor
          or private. Overrides the server-wide default.'
        in: formData
        name: default_permission
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.createDocumentResponse'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Create document
      tags:
      - documents
  /v1/documents/{id}:
    delete:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Delete document
      tags:
      - documents
    get:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repo.Document'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Get document
      tags:
      - documents
    patch:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repo.Document'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Update document
      tags:
      - documents
  /v1/documents/{id}/comments:
    get:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: open|resolved|stale|orphaned|all
        in: query
        name: status
        type: string
      - description: Version ID
        in: query
        name: version_id
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.listResponse-server_commentResponse'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: List comments
      tags:
      - comments
    post:
      consumes:
      - application/json
      - application/vnd.aidocs.comment-mentions+json
      description: Requests with non-empty mentions must use Content-Type application/vnd.aidocs.comment-mentions+json
        so mixed-version deployments fail closed instead of dropping metadata.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Comment body, anchor, and structured mentions
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/server.createCommentRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.commentResponse'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Create comment
      tags:
      - comments
  /v1/documents/{id}/comments/{comment_id}:
    delete:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Comment ID
        in: path
        name: comment_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Delete comment
      tags:
      - comments
    patch:
      consumes:
      - application/json
      - application/vnd.aidocs.comment-mentions+json
      description: Any request containing the mentions key, including an empty array,
        must use Content-Type application/vnd.aidocs.comment-mentions+json so mixed-version
        deployments fail closed.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Comment ID
        in: path
        name: comment_id
        required: true
        type: string
      - description: Fields to update; omitted mentions are preserved unless the body
          changes
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/server.patchCommentRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.commentResponse'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Update comment
      tags:
      - comments
  /v1/documents/{id}/comments/{comment_id}/replies:
    post:
      consumes:
      - application/json
      - application/vnd.aidocs.comment-mentions+json
      description: Requests with non-empty mentions must use Content-Type application/vnd.aidocs.comment-mentions+json
        so mixed-version deployments fail closed instead of dropping metadata.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Parent Comment ID
        in: path
        name: comment_id
        required: true
        type: string
      - description: Reply body and structured mentions
        in: body
        name: reply
        required: true
        schema:
          $ref: '#/definitions/server.createCommentReplyRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.commentResponse'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Create comment reply
      tags:
      - comments
  /v1/documents/{id}/grants:
    post:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.createGrantResponse'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Create document grant
      tags:
      - grants
  /v1/documents/{id}/grants/{grant_id}:
    delete:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Grant ID
        in: path
        name: grant_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Delete document grant
      tags:
      - grants
    patch:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Grant ID
        in: path
        name: grant_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repo.Grant'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Update document grant
      tags:
      - grants
  /v1/documents/{id}/versions:
    get:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.listResponse-repo_Version'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: List versions
      tags:
      - versions
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Base version ID
        in: formData
        name: base_version_id
        required: true
        type: string
      - description: Change summary
        in: formData
        name: change_summary
        type: string
      - description: HTML file
